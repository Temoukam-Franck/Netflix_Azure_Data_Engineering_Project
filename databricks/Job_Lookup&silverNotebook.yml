resources:
  jobs:
    Lookup_silverNotebook_job:
      name: Lookup&silverNotebook_job
      tasks:
        - task_key: Lookup_Notebook
          notebook_task:
            notebook_path: databricks/3.LookupNotebook
            source: GIT
          environment_key: Lookup_Notebook_environment
        - task_key: SilverNotebook
          depends_on:
            - task_key: Lookup_Notebook
          for_each_task:
            inputs: "{{tasks.Lookup_Notebook.values.my_arr}}"
            task:
              task_key: SilverNotebook_iteration
              notebook_task:
                notebook_path: databricks/2.silver
                base_parameters:
                  sourcefolder: "{{input.sourcefolder}}"
                  targetfolder: "{{input.targetfolder}}"
                source: GIT
              environment_key: Lookup_Notebook_environment
      git_source:
        git_url: https://github.com/Temoukam-Franck/Netflix_Azure_Data_Engineering_Project
        git_provider: gitHub
        git_branch: main
      queue:
        enabled: true
      environments:
        - environment_key: Lookup_Notebook_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
